name: weather_master_app
description: "A new Flutter project."
publish_to: "none"
version: 3.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.1
  material_color_utilities: ^0.11.1
  animations: ^2.0.11
  flutter_svg: ^2.0.11
  lottie: ^3.1.2
  lat_lng_to_timezone: ^0.2.0
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  provider: ^6.1.2
  connectivity_plus: ^6.0.3
  restart_app: ^1.2.1
  intl: ^0.20.2
  material_symbols_icons: ^4.2815.1
  flutter_compass: ^0.8.1
  dynamic_color: ^1.7.0
  xml: ^6.5.0
  fl_chart: ^0.68.0
  easy_localization: ^3.0.7+1
  url_launcher: ^6.3.0
  reorderable_grid_view: ^2.2.6
  custom_refresh_indicator: ^3.1.1
  flutter_markdown: ^0.7.1
  solar_calculator: ^1.0.3
  file_picker: ^8.0.5
  flutter_dotenv: ^5.1.0
  home_widget: ^0.8.0
  permission_handler: ^11.3.1
  moon_phase: ^1.0.2+9
  flex_color_picker: ^3.5.0
  flutter_displaymode: ^0.6.0
  google_fonts: ^6.2.1
  settings_ui: ^2.0.2
  simple_animations: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/weather-icons/
    - assets/foreground-animations/
    - assets/translations/
    - assets/froggie/
    - .env

  fonts:
    - family: DefaultFont
      fonts:
        - asset: assets/fonts/nato-Medium.ttf
          weight: 400
        - asset: assets/fonts/nato-Medium.ttf
          weight: 500
        - asset: assets/fonts/nato-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/nato-Bold.ttf
          weight: 700

    - family: FlexFontEn
      fonts:
        - asset: assets/fonts/flex-Regular.ttf
          weight: 400
        - asset: assets/fonts/flex-Medium.ttf
          weight: 500
        - asset: assets/fonts/flex-Medium.ttf
          weight: 600
        - asset: assets/fonts/flex-Bold.ttf
          weight: 700
